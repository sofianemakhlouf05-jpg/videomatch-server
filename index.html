<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoMatch</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: rgba(255,255,255,0.07);
      --accent: #ff3c6e;
      --accent2: #7c3aed;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --green: #22c55e;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── ÉCRAN D'ACCUEIL ── */
    #screen-home {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .tagline {
      color: var(--muted);
      font-size: 1rem;
      max-width: 280px;
      line-height: 1.6;
    }

    .btn-start {
      padding: 1rem 3rem;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 0 40px rgba(255,60,110,0.35);
    }

    .btn-start:hover { transform: scale(1.05); }
    .btn-start:active { transform: scale(0.97); opacity: 0.9; }

    /* ── ÉCRAN CAMÉRA ── */
    #screen-call {
      display: none;
      width: 100%;
      height: 100dvh;
      position: relative;
      background: #000;
    }

    /* Vidéo distante (plein écran) */
    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Vidéo locale (PiP) */
    #local-video {
      position: absolute;
      bottom: 110px;
      right: 16px;
      width: 100px;
      height: 140px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      z-index: 10;
      transform: scaleX(-1); /* miroir */
    }

    /* Overlay status */
    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,15,0.85);
      z-index: 20;
      gap: 1.2rem;
    }

    .status-logo {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status-text {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .pulse-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      animation: pulse 1.5s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Contrôles bas */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 10;
    }

    .ctrl-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.4rem;
      transition: transform 0.2s, opacity 0.2s;
    }

    .ctrl-btn:active { transform: scale(0.9); }

    #btn-skip {
      background: linear-gradient(135deg, var(--accent), #ff6b9d);
      box-shadow: 0 0 30px rgba(255,60,110,0.5);
    }

    #btn-mute {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    #btn-mute.muted {
      background: rgba(255,60,110,0.3);
    }

    #btn-cam {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    /* Indicateur de connexion */
    #conn-badge {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 500;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    #conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    #conn-dot.connected { background: var(--green); }

    /* Swipe hint */
    #swipe-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 30;
      display: none;
    }

    .swipe-arrow {
      font-size: 4rem;
      animation: swipeAnim 0.5s ease forwards;
    }

    @keyframes swipeAnim {
      0% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-120px); }
    }

    /* Toast notif */
    #toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,20,30,0.9);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; }

    /* Swipe gesture overlay (zone de détection) */
    #gesture-area {
      position: absolute;
      inset: 0;
      z-index: 9;
    }
  </style>
</head>
<body>

<!-- ═══ ÉCRAN ACCUEIL ═══ -->
<div id="screen-home">
  <div class="logo">VideoMatch</div>
  <p class="tagline">Rencontre des personnes du monde entier en vidéo, en un swipe.</p>
  <button class="btn-start" onclick="startApp()">Démarrer 🎥</button>
</div>

<!-- ═══ ÉCRAN CALL ═══ -->
<div id="screen-call">

  <!-- Badge connexion -->
  <div id="conn-badge">
    <div id="conn-dot"></div>
    <span id="conn-label">Connexion…</span>
  </div>

  <!-- Vidéos -->
  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted></video>

  <!-- Zone de détection swipe -->
  <div id="gesture-area"></div>

  <!-- Overlay d'attente -->
  <div id="status-overlay">
    <div class="pulse-ring"></div>
    <div class="status-logo">VideoMatch</div>
    <div id="status-text">Démarrage de la caméra…</div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Animation swipe -->
  <div id="swipe-hint"><div class="swipe-arrow">👈</div></div>

  <!-- Contrôles -->
  <div id="controls">
    <button class="ctrl-btn" id="btn-mute" onclick="toggleMute()" title="Micro">🎤</button>
    <button class="ctrl-btn" id="btn-skip" onclick="skipPartner()" title="Suivant">⏭️</button>
    <button class="ctrl-btn" id="btn-cam" onclick="toggleCam()" title="Caméra">📷</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  ⚠️  CHANGE CETTE URL par l'URL de ton serveur
//  Ex: "https://ton-app.railway.app"
// ══════════════════════════════════════════════
const SERVER_URL = "https://videomatch-server-production.up.railway.app";

// ── État global ──
let socket = null;
let localStream = null;
let peerConnection = null;
let currentRoomId = null;
let isMuted = false;
let isCamOff = false;

const iceConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:openrelay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject",
    },
    {
      urls: "turn:openrelay.metered.ca:443",
      username: "openrelayproject",
      credential: "openrelayproject",
    },
  ],
};

// ── Éléments DOM ──
const screenHome = document.getElementById("screen-home");
const screenCall = document.getElementById("screen-call");
const remoteVideo = document.getElementById("remote-video");
const localVideo = document.getElementById("local-video");
const statusOverlay = document.getElementById("status-overlay");
const statusText = document.getElementById("status-text");
const connDot = document.getElementById("conn-dot");
const connLabel = document.getElementById("conn-label");

// ── Démarrage ──
async function startApp() {
  screenHome.style.display = "none";
  screenCall.style.display = "block";

  // 1. Accès caméra/micro
  setStatus("Accès à la caméra…");
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;
  } catch (err) {
    setStatus("❌ Caméra refusée. Autorise l'accès et recharge la page.");
    return;
  }

  // 2. Connexion serveur
  setStatus("Connexion au serveur…");
  socket = io(SERVER_URL, { transports: ["websocket"] });

  socket.on("connect", () => {
    setConnected(true, "Connecté");
    findMatch();
  });

  socket.on("disconnect", () => {
    setConnected(false, "Déconnecté");
    setStatus("❌ Connexion perdue.");
  });

  socket.on("waiting", () => {
    setStatus("🔍 Recherche d'un partenaire…");
    showOverlay(true);
  });

  socket.on("match_found", async ({ roomId, isInitiator }) => {
    currentRoomId = roomId;
    showOverlay(false);
    setConnected(true, "En call");
    await createPeerConnection();
    if (isInitiator) {
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit("webrtc_offer", { roomId, offer });
    }
  });

  socket.on("webrtc_offer", async ({ offer }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit("webrtc_answer", { roomId: currentRoomId, answer });
  });

  socket.on("webrtc_answer", async ({ answer }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
  });

  socket.on("webrtc_ice_candidate", async ({ candidate }) => {
    try {
      await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    } catch {}
  });

  socket.on("partner_skipped", () => {
    showToast("L'autre personne est passée à la suivante");
    closePeerConnection();
    findMatch();
  });

  socket.on("partner_disconnected", () => {
    showToast("Partenaire déconnecté");
    closePeerConnection();
    findMatch();
  });
}

function findMatch() {
  setStatus("🔍 Recherche d'un partenaire…");
  showOverlay(true);
  socket.emit("find_match");
}

async function createPeerConnection() {
  closePeerConnection();
  peerConnection = new RTCPeerConnection(iceConfig);

  // Ajouter les tracks locaux
  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  // Recevoir les tracks distants
  peerConnection.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  // ICE candidates
  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit("webrtc_ice_candidate", {
        roomId: currentRoomId,
        candidate: event.candidate,
      });
    }
  };

  peerConnection.onconnectionstatechange = () => {
    const state = peerConnection.connectionState;
    if (state === "connected") setConnected(true, "En call ✅");
    if (state === "failed" || state === "disconnected") findMatch();
  };
}

function closePeerConnection() {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  remoteVideo.srcObject = null;
  currentRoomId = null;
}

// ── Actions ──
function skipPartner() {
  showSwipeAnimation();
  socket.emit("skip");
  closePeerConnection();
  findMatch();
}

function toggleMute() {
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const btn = document.getElementById("btn-mute");
  btn.textContent = isMuted ? "🔇" : "🎤";
  btn.classList.toggle("muted", isMuted);
}

function toggleCam() {
  isCamOff = !isCamOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  document.getElementById("btn-cam").textContent = isCamOff ? "🚫" : "📷";
}

// ── Swipe (tactile & souris) ──
let touchStartX = 0;
const gestureArea = document.getElementById("gesture-area");

gestureArea.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

gestureArea.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -60) skipPartner(); // swipe gauche > 60px
}, { passive: true });

// Swipe souris
gestureArea.addEventListener("mousedown", e => { touchStartX = e.clientX; });
gestureArea.addEventListener("mouseup", e => {
  const dx = e.clientX - touchStartX;
  if (dx < -60) skipPartner();
});

// ── UI helpers ──
function setStatus(text) { statusText.textContent = text; }
function showOverlay(visible) { statusOverlay.style.display = visible ? "flex" : "none"; }
function setConnected(connected, label) {
  connDot.className = connected ? "connected" : "";
  connLabel.textContent = label;
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 3000);
}

function showSwipeAnimation() {
  const hint = document.getElementById("swipe-hint");
  hint.style.display = "block";
  hint.innerHTML = '<div class="swipe-arrow">👈</div>';
  setTimeout(() => { hint.style.display = "none"; }, 600);
}
</script>
</body>
</html>
